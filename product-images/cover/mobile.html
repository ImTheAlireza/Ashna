<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کاور آشنا — نسخهٔ موبایل ۱۲۰۰×۱۲۰۰</title>
<style>
  @font-face{font-family:'Estedad';src:url('../../assets/fonts/estedad/estedad-400.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Estedad';src:url('../../assets/fonts/estedad/estedad-500.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:'Estedad';src:url('../../assets/fonts/estedad/estedad-700.woff2') format('woff2');font-weight:700;font-display:block}
  @font-face{font-family:'Estedad';src:url('../../assets/fonts/estedad/estedad-900.woff2') format('woff2');font-weight:900;font-display:block}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#02070F}
  body{display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}

  .cover{
    position:relative;width:1200px;height:1200px;overflow:hidden;direction:rtl;
    font-family:'Estedad',sans-serif;color:#EAF3FF;
    background:
      radial-gradient(820px 700px at 76% 26%, rgba(37,99,235,.46) 0%, rgba(37,99,235,0) 66%),
      radial-gradient(760px 620px at 10% 86%, rgba(14,165,233,.20) 0%, rgba(14,165,233,0) 68%),
      radial-gradient(600px 460px at 96% 100%, rgba(16,185,129,.10) 0%, rgba(16,185,129,0) 70%),
      linear-gradient(152deg,#05132C 0%,#07224C 48%,#04102A 100%);
  }

  /* ---------------- background ---------------- */
  .pattern{position:absolute;inset:0;opacity:.065;
    background-image:url('img/pattern-shield.svg');background-size:150px 150px;
    mask-image:linear-gradient(258deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.85) 44%,#000 100%);
    -webkit-mask-image:linear-gradient(258deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.85) 44%,#000 100%)}
  .grain{position:absolute;inset:0;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>")}
  .rings{position:absolute;left:-140px;top:170px;width:900px;height:900px;border-radius:50%;
    border:1px solid rgba(126,182,255,.075)}
  .rings::before,.rings::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(126,182,255,.055)}
  .rings::before{inset:150px}
  .rings::after{inset:300px}
  .streak{position:absolute;left:-200px;top:1090px;width:1100px;height:1.4px;transform:rotate(-12deg);
    background:linear-gradient(90deg,rgba(120,180,255,0),rgba(120,180,255,.20) 34%,rgba(120,180,255,0) 78%)}
  .vig{position:absolute;inset:0;
    background:radial-gradient(126% 106% at 52% 46%, rgba(2,7,16,0) 38%, rgba(2,7,16,.5) 88%, rgba(2,7,16,.72) 100%)}

  /* ---------------- art: real product screenshot in a tablet ---------------- */
  .stage{position:absolute;left:44px;top:0;width:500px;height:1200px}
  .dev-glow{position:absolute;left:-50px;top:170px;width:640px;height:860px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(56,140,255,.32),rgba(56,140,255,0) 74%);filter:blur(24px)}
  .tablet{position:absolute;left:34px;top:288px;width:460px;height:632px;border-radius:36px;padding:10px;
    background:linear-gradient(158deg,#F6FAFF 0%,#A9BFDC 26%,#E9F2FE 54%,#93AACB 100%);
    box-shadow:0 70px 120px -46px rgba(0,4,14,.96), 0 20px 46px -24px rgba(0,4,14,.9),
               0 0 0 1px rgba(255,255,255,.16), 0 0 80px -14px rgba(66,150,255,.35);
    transform:rotate(-1.1deg)}
  .screen{position:relative;width:100%;height:100%;border-radius:25px;overflow:hidden;
    background:linear-gradient(172deg,#F7FAFF 0%,#EDF3FC 60%,#E4EDFA 100%);
    display:grid;place-items:center;padding:14px;
    box-shadow:inset 0 0 0 1.4px rgba(8,22,46,.32)}
  .screen img{display:block;width:100%;border-radius:12px;background:#fff;
    box-shadow:0 22px 40px -24px rgba(12,35,80,.55), 0 0 0 1px rgba(180,200,230,.32)}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:25px;
    background:linear-gradient(118deg,rgba(255,255,255,.36) 0%,rgba(255,255,255,.07) 26%,rgba(255,255,255,0) 46%)}
  .floor{position:absolute;left:10px;top:880px;width:520px;height:120px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(56,150,255,.20),rgba(56,150,255,0) 76%);filter:blur(14px)}
  .cam{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;
    background:rgba(12,26,50,.45);z-index:4}

  /* ---------------- identity ---------------- */
  .identity{position:absolute;right:54px;top:0;width:572px;height:1200px;
    display:flex;flex-direction:column;justify-content:center}

  .brand{height:164px;display:flex;align-items:center;position:relative;isolation:isolate}
  .wordmark{position:relative;height:164px;width:536px;flex:none}
  .wordmark span{position:absolute;inset:0;
    -webkit-mask:url('img/ashna-logo-crop.svg') center/100% 100% no-repeat;
    mask:url('img/ashna-logo-crop.svg') center/100% 100% no-repeat}
  .w-glow{background:radial-gradient(56% 106% at 48% 58%,rgba(96,163,255,.9),rgba(46,107,230,.30) 58%,rgba(46,107,230,0) 86%);
    filter:blur(30px);transform:translateY(9px) scale(1.02);opacity:.42;z-index:-1}
  .w-shadow2{background:#00050F;filter:blur(42px);transform:translate(0,30px);opacity:.20}
  .w-shadow{background:#00050F;filter:blur(18px);transform:translate(0,12px);opacity:.26}
  .w-face{background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 42%,#F2F8FF 64%,#DFEDFE 84%,#D2E4FA 100%)}
  .w-gloss{background:linear-gradient(178deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.55) 18%,rgba(255,255,255,.10) 32%,rgba(255,255,255,0) 42%);
    mix-blend-mode:screen}
  .w-bounce{background:linear-gradient(0deg,rgba(122,178,247,.55) 0%,rgba(122,178,247,.14) 12%,rgba(122,178,247,0) 26%);
    mix-blend-mode:screen;opacity:.35}
  .w-rim{background:linear-gradient(203deg,rgba(196,230,255,1) 0%,rgba(120,180,250,0) 50%);
    transform:translate(-1.2px,-1.2px);opacity:.22;mix-blend-mode:screen}
  .w-shade{background:linear-gradient(0deg,rgba(10,34,78,.18) 0%,rgba(10,34,78,0) 40%)}

  .sub{margin-top:26px;font-size:35px;font-weight:500;line-height:1.35;color:#CFE3FB;
    text-shadow:0 8px 22px rgba(3,14,36,.55);white-space:nowrap}
  .sub b{font-weight:700;color:#FFFFFF}

  .rule{height:1px;margin-top:26px;
    background:linear-gradient(270deg,rgba(130,180,250,.46),rgba(130,180,250,.12) 62%,rgba(130,180,250,0))}

  .features{margin-top:16px;display:flex;flex-direction:column}
  .feat{display:flex;align-items:center;gap:17px;height:64px}
  .feat p{font-size:26px;font-weight:500;color:#D8E7FA;white-space:nowrap;
    text-shadow:0 6px 18px rgba(2,9,24,.55)}
  .feat p b{font-weight:700;color:#FFFFFF}

  .fico{position:relative;width:52px;height:49px;flex:none;border-radius:14px;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(163deg,var(--top),var(--bot));
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.55),
      inset 0 -10px 14px rgba(4,12,30,.22),
      0 6px 0 var(--deep),
      0 16px 20px -12px rgba(1,6,18,.92)}
  .fico::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:34%;border-radius:11px 11px 60% 60%;
    background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
  .fico svg{width:24px;height:24px;position:relative;z-index:1;
    filter:drop-shadow(0 2px 2px rgba(4,12,30,.35))}
  .fico.f1{--top:#5C9BFF;--bot:#2563EB;--deep:#12408F}
  .fico.f2{--top:#54C8F8;--bot:#0284C7;--deep:#08466E}
  .fico.f3{--top:#45E29C;--bot:#0EA36B;--deep:#076A47}
  .fico.f4{--top:#9E90FF;--bot:#5B4BE0;--deep:#372C93}
</style>
</head>
<body>
<div class="cover" id="cover">

  <div class="pattern" data-bleed></div>
  <div class="grain" data-bleed></div>
  <div class="rings" data-bleed></div>
  <div class="streak" data-bleed></div>
  <div class="vig" data-bleed></div>

  <div class="stage">
    <div class="dev-glow" data-bleed></div>
    <div class="floor" data-bleed></div>
    <div class="tablet">
      <div class="cam"></div>
      <div class="screen">
        <img src="../infographic/img/00-card.webp" alt="صفحهٔ ورود آشنا در موبایل">
      </div>
    </div>
  </div>

  <div class="identity">

    <div class="brand" aria-label="آشنا">
      <div class="wordmark" role="img" aria-label="آشنا">
        <span class="w-glow"></span>
        <span class="w-shadow2"></span>
        <span class="w-shadow"></span>
        <span class="w-face"></span>
        <span class="w-shade"></span>
        <span class="w-bounce"></span>
        <span class="w-gloss"></span>
        <span class="w-rim"></span>
      </div>
    </div>

    <div class="sub">ورود و ثبت‌نام <b>پیامکی</b> وردپرس</div>

    <div class="rule"></div>

    <div class="features">
      <div class="feat">
        <span class="fico f1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.2 4.6h15.6a2.2 2.2 0 0 1 2.2 2.2v7.4a2.2 2.2 0 0 1-2.2 2.2h-7.9L7.3 20.2v-3.8H4.2A2.2 2.2 0 0 1 2 14.2V6.8a2.2 2.2 0 0 1 2.2-2.2Z"/>
            <circle cx="8" cy="10.5" r="1.15" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="10.5" r="1.15" fill="currentColor" stroke="none"/>
            <circle cx="16" cy="10.5" r="1.15" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <p>ورود با <b>کد پیامکی</b>، بدون رمز عبور</p>
      </div>

      <div class="feat">
        <span class="fico f2">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.9 21 7.6 12 12.3 3 7.6l9-4.7Z"/>
            <path d="m3.4 12.2 8.6 4.5 8.6-4.5"/>
            <path d="m3.4 16.7 8.6 4.5 8.6-4.5"/>
          </svg>
        </span>
        <p>پشتیبانی از <b>شش درگاه پیامکی</b> ایرانی</p>
      </div>

      <div class="feat">
        <span class="fico f3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.4 20.2 5.9v6.2c0 4.9-3.4 8.1-8.2 10.5-4.8-2.4-8.2-5.6-8.2-10.5V5.9L12 2.4Z"/>
            <path d="m8.4 11.9 2.5 2.5 4.7-4.9"/>
          </svg>
        </span>
        <p><b>ضد اسپم و بمبر</b> با سقف دقیقه‌ای</p>
      </div>

      <div class="feat">
        <span class="fico f4">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.1" cy="11.6" r="4"/>
            <path d="M11.1 11.6h9.7"/>
            <path d="M16.4 11.6v4.2"/>
            <path d="M19.9 11.6v3"/>
          </svg>
        </span>
        <p>ورود با <b>گوگل، تلگرام و Passkey</b></p>
      </div>
    </div>

  </div>

</div>
</body>
</html>
