<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کاور محصول آشنا — ورود و ثبت‌نام وردپرس</title>
<!-- کاور اصلی: ۲۱۰۰×۱۰۴۰ پیکسل، با یک وکتور و چهار ویژگی کوتاه. -->
<style>
@font-face{font-family:Vazirmatn;src:url('../../assets/fonts/vazirmatn/Vazirmatn-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:Estedad;src:url('../../assets/fonts/estedad/estedad-700.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:Estedad;src:url('../../assets/fonts/estedad/estedad-900.woff2') format('woff2');font-weight:900;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;background:#071326}
body{font-family:Vazirmatn,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'ss01'}
#cover{position:relative;overflow:hidden;width:2100px;height:1040px;color:#fff;direction:rtl;background:radial-gradient(900px 760px at 23% 53%,rgba(26,102,184,.31),transparent 70%),radial-gradient(900px 700px at 96% -12%,rgba(31,79,151,.22),transparent 68%),linear-gradient(132deg,#07172c,#081629 58%,#050f21)}
#cover::before{content:'';position:absolute;inset:30px;border:2px solid rgba(177,213,248,.13);border-radius:34px;pointer-events:none}
#cover::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#3fc4f4 28%,#2e66db 67%,transparent);opacity:.65}
.art{position:absolute;left:70px;top:67px;width:940px;height:900px;display:flex;align-items:center;justify-content:center}
.art img{display:block;width:1020px;height:1020px;object-fit:contain;flex:none}
.identity{position:absolute;right:103px;top:76px;width:965px}
.meta{display:flex;align-items:center;gap:13px;font-size:28px;font-weight:700;color:#D9E9FF}
.flag{display:block;width:43px;height:43px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.flag svg{display:block;width:100%;height:100%}
.brand{height:234px;margin-top:21px;display:flex;align-items:center}
.brand img{display:block;width:850px;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.28))}
.subtitle{display:inline-flex;align-items:center;min-height:82px;margin:9px 0 0;padding:9px 24px;border-right:8px solid #7CE1FF;border-radius:10px 4px 4px 10px;background:linear-gradient(90deg,rgba(34,95,215,.65),#2D69D9);box-shadow:0 12px 30px rgba(1,10,34,.24)}
.subtitle h1{margin:0;font-family:Estedad,Vazirmatn,sans-serif;font-size:49px;line-height:1.45;font-weight:700;white-space:nowrap}
.english{margin-top:17px;color:#96BDE9;font-size:25px;font-weight:700;letter-spacing:.18em;direction:ltr;text-align:right;white-space:nowrap}
.rule{width:100%;height:2px;margin-top:23px;background:linear-gradient(90deg,transparent,rgba(160,204,245,.32))}
.features{display:grid;gap:14px;margin:26px 0 0;padding:0;list-style:none}
.features li{display:flex;align-items:center;gap:17px;min-height:58px;font-size:39px;font-weight:600;line-height:1.5;color:#EDF5FF;white-space:nowrap}
.features li::before{content:'';flex:none;width:13px;height:13px;border-radius:3px;background:#3BDCC4;box-shadow:0 0 0 7px rgba(59,220,196,.11)}
.features b{font-weight:800;color:#fff}
.footer{position:absolute;right:103px;bottom:66px;display:flex;gap:16px;align-items:center;font-size:25px;font-weight:600;color:#8FAFD2}
.footer .sep{opacity:.4}.footer .site{direction:ltr}
</style>
</head>
<body>
<main id="cover" aria-label="کاور آشنا، افزونه ورود و ثبت‌نام وردپرس">
  <div class="art"><img src="img/login-shield.svg" alt=""></div>
  <div class="identity">
    <div class="meta">
      <span class="flag" aria-hidden="true"><svg viewBox="0 0 60 60"><rect width="60" height="20" fill="#239F40"/><rect y="20" width="60" height="20" fill="#fff"/><rect y="40" width="60" height="20" fill="#DA0000"/><path d="M30 24.6c2.2 1.7 3.3 3.6 3.3 5.4S32.2 33.7 30 35.4c-2.2-1.7-3.3-3.6-3.3-5.4s1.1-3.7 3.3-5.4Z" fill="#DA0000"/><path d="M22.6 26.4c1.4 2.3 1.4 5.3 0 7.6M37.4 26.4c-1.4 2.3-1.4 5.3 0 7.6" stroke="#DA0000" stroke-width="1.1" fill="none"/></svg></span>
      <span>محصول ایرانی</span>
    </div>
    <div class="brand"><img src="../infographic/img/ashna-logo-white.svg" alt="آشنا"></div>
    <div class="subtitle"><h1>ورود و ثبت‌نام پیامکی وردپرس</h1></div>
    <div class="english">ASHNA · WORDPRESS LOGIN</div>
    <div class="rule"></div>
    <ul class="features">
      <li>پیامک، بله و ایمیل</li>
      <li>گوگل، تلگرام و <b dir="ltr">Passkey</b></li>
      <li>۶ درگاه، ۳ پشتیبان و امنیت ضد اسپم</li>
      <li>ووکامرس، دکان و المنتور</li>
    </ul>
  </div>
  <div class="footer"><span>محصولی از پارسنا</span><span class="sep">·</span><span class="site">parsena.ir/ashna</span></div>
</main>
</body>
</html>
